-- NoTrackLimits - Coppertine, with help from Distantz, Inaki, DotNet and plenty of others. With permission from Distantz and EvansMad
-- To Reload the config, reload the park.
-- More info: https://github.com/Coppertine/NoTrackLimits/wiki/Configuration/

-- By default, "realistic" mode is used, this is a port of Distantz and EvansMad's No Track Limits V3: Realism Overhaul mod
-- Setting to "custom" uses the values within tConfig instead. If an error occors, realistic mode would be used instead:
-- Realistic Mode Reference: https://github.com/Coppertine/NoTrackLimits/wiki/Realistic-Preset
eConfigMode = "custom"

-- Setting to `true` turns on Fontier's Look-Ahead Camera when on ride, disable if you prefer PC1 style ride camera or use a ride camera mod such as Cam Offsets
bEnableCameraEffects = false

-- Fixes the incorrect rotation on some trains when Look-Ahead is disabled.
bPatchTrainCameras = true

-- Adds every train (excluding go-karts) into every ride
bAllowAllInterchangableCoasterTrains = true

-- Prints verbose information for debugging purposes. Works best with ACSEDebug or Kaiodenic's External Debugger
bPrintDebugLog = false

-- The heart and brains of NoTrackLimits, anything in here relates to an internal value to change. Remove a section or set values to nil to revert to vanilla values. Requires eConfigMode set to "custom"
-- Setting a value to nil uses the vanilla assigned value instead.
tConfig = {
    -- A string list of elements to append to every ride.
    -- Although there is DLC detection, it is broken. So we are not responsible for users using DLC only elements without purchasing the DLC.
    tAppendedElements = {
        "default_chainlift",
        "default_LSM",
        "default_LSM_HoldingSection",
        "TK_501_DropTrack",
        "TK_501_DropTrack_R",
        "TK_509_TiltTrack",
        "TK_501_SwitchTrack",
        "TK_501_SwitchTrack_L",
        "TK_501_EdgeTilt",
        "TK_501_Turntable_90L_R",
        "TK_501_Turntable_90R_R",
        "TK_501_Turntable_90R",
        "TK_501_Turntable_90L",
        "TK_501_TurntableF",
        "TK_501_TurntableF_R",
        "TK_501_MotionTableF",
        "TK_501_MotionTable_90L",
        "TK_501_MotionTable_90R",
        "TK_501_BungeeLift",
        "TK_501_CombinedLift",
        "default_booster",
        "friction_wheel_lift",
        "TK_501_EdgeTilt",
        "TK_501_TeeterTotterF",
        "TK_501_TeeterTotter_90L",
        "TK_501_TeeterTotter_90R",
        "TK_501_TeeterTotter_R",
        "TK_502_DoubleLift",
