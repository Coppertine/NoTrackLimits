    },
    -- Same as above but you can set to spesific slope ranges here. -90 and 90 would make it so you can do 90 degrees at a time.
    tRideSlopeRange = {
        min = -360.0,
        max = 360.0
    },
    -- The min and max range for roll / banking a track segment in degrees. (max delta defines how far you can bank per track segment)
    tBankingRange = {
        min = -50000.0,
        max = 50000.0,
        maxDelta = 360,
        tAppendToElements = {
            "viperone_reverselaunch", "default_reverselaunch", "default_LSM", "default_LSM_HoldingSection"
