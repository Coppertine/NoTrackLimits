    -- The min and maximum length of the track in meters.
    tTrackLength = {
        min = 0.5,
        max = 100,
        step = 0.5
    },
    -- The min and max range for pitch / sloping a track segment in degrees (by default is set to maxed values)
    tSlopeRange = {
